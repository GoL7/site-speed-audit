name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    uses: skills-il/release-workflow/.github/workflows/release.yml@v1
    with:
      subject_path: |
        **/SKILL.md
        **/SKILL_HE.md
        **/scripts/**
        **/assets/**
        **/references/**
